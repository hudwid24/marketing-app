version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: marketing_db
    ports:
      - "5433:5432"

  web:
    build: ./app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
